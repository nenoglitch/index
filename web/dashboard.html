<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人主页</title>
  <link rel="stylesheet" href="./css/common.css">
  <link rel="stylesheet" href="./css/dashboard.css">
</head>
<body>
  <main class="page">
    <section class="card dashboard-card">
      <h1 class="title">欢迎回来</h1>

      <div id="status" class="status">正在校验登录状态…</div>

      <div id="user-panel" class="user-panel" hidden>
        <div class="avatar" id="avatar">?</div>
        <div class="user-meta">
          <span class="label">当前用户名</span>
          <span class="username" id="username">—</span>
          <span class="email" id="email">—</span>
        </div>
      </div>

      <button id="logout-btn" class="btn logout-btn" type="button" hidden>退出登录</button>
      <a class="home-link" href="./index.html">返回首页</a>
    </section>
  </main>

  <script type="module" src="./js/dashboard.js"></script>
</body>
</html>
