<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录</title>
  <link rel="stylesheet" href="./css/common.css">
  <link rel="stylesheet" href="./css/login.css">
</head>
<body>
  <main class="page">
    <section class="card login-card">
      <h1 class="title">账号登录</h1>
      <p class="subtitle">使用邮箱或用户名登录</p>

      <form id="login-form" novalidate>
        <div class="form-item">
          <label for="account">账号（邮箱 / 用户名）</label>
          <input id="account" name="account" type="text" autocomplete="username" placeholder="请输入邮箱或用户名">
        </div>
        <div class="form-item">
          <label for="password">密码</label>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码">
        </div>
        <button id="login-btn" class="btn" type="submit">登录</button>
      </form>

      <div id="login-tip" class="tip"></div>

      <div class="link-group">
        还没有账号？<a href="./register.html">去注册</a>
        &nbsp;|&nbsp;
        <a href="./index.html">返回首页</a>
      </div>
    </section>
  </main>

  <script type="module" src="./js/login.js"></script>
</body>
</html>
