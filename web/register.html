<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册</title>
  <link rel="stylesheet" href="./css/common.css">
  <link rel="stylesheet" href="./css/register.css">
</head>
<body>
  <main class="page">
    <section class="card register-card">
      <h1 class="title">注册账号</h1>
      <p class="subtitle">用户名 3-32 位字母 / 数字 / 下划线，密码至少 8 位</p>

      <form id="register-form" novalidate>
        <div class="form-item">
          <label for="username">用户名</label>
          <input id="username" name="username" type="text" autocomplete="username" placeholder="请设置用户名">
        </div>
        <div class="form-item">
          <label for="email">邮箱</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="请输入邮箱地址">
        </div>
        <div class="form-item">
          <label for="password">密码</label>
          <input id="password" name="password" type="password" autocomplete="new-password" placeholder="请设置密码（至少 8 位）">
        </div>
        <button id="register-btn" class="btn" type="submit">注册并进入主页</button>
      </form>

      <div id="register-tip" class="tip"></div>

      <div class="link-group">
        已有账号？<a href="./login.html">去登录</a>
        &nbsp;|&nbsp;
        <a href="./index.html">返回首页</a>
      </div>
    </section>
  </main>

  <script type="module" src="./js/register.js"></script>
</body>
</html>
